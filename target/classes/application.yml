spring:
  application:
    name: directpurchase
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  flyway:
    locations: classpath:/db/migration
    schemas: direct_purchase
    baselineOnMigrate: true
    enabled: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=direct_purchase
    username: direct_purchase
    password: directpurchase
  jpa:
    generate-ddl: true
    hibernate: 
      ddl-auto: update
---
server:
 port: 1301
---
springdoc:
 api-docs:
  path: /api-docs